name: Fork CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork-impact:
    name: Fork impact checks
    if: github.repository == 'steveonjava/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          prune-python-cache: true
      - name: Check fork delta and retained behavior
        run: |
          python - <<'PY'
          import subprocess
          from scripts.fork_sync import check_command
          subprocess.run(check_command(), check=True)
          PY
