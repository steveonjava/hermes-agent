name: Tests

on:
  workflow_call:

permissions:
  contents: read

# Cancel in-progress runs for the same ref
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests (shard ${{ matrix.slice }}/4)
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pin the uv version: unpinned, setup-uv resolves "latest" by
          # fetching a manifest from raw.githubusercontent.com on EVERY job —
          # a transient fetch failure fails the whole job (2026-07-28 slice-5
          # incident). Pinned, the binary downloads directly; no manifest hop.
          version: "0.9.28"
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        #
        # The trailing extras beyond all/dev are the lazy-install features
        # (tools/lazy_deps.py) that tests exercise for real: provider.anthropic,
        # stt/tts.mistral, image.fal, terminal.modal, terminal.daytona,
        # memory.hindsight, search.parallel. The hermetic test env forbids
        # mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in
        # tests/conftest.py), so the SDKs those tests need must be in the
        # venv up front — resolved from uv.lock like everything else, which
        # also honors the exact supply-chain pins these extras carry.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Run tests
        # Per-file isolation via scripts/run_tests.sh: each test file runs
        # in its own freshly-spawned `python -m pytest <file>` subprocess
        # with bounded parallelism. No xdist, no shared workers, no
        # module-level state leakage between files.
        #
        # Each fresh checkout uses identical tracked duration inputs. Do not
        # restore a mutable duration cache before the runner partitions files.
        run: |
          source .venv/bin/activate
          workers=$(python - <<'PY'
          import errno
          import json
          import math
          import os
          from pathlib import Path
          import re
          import sys

          limits = [4]
          measurements = {}
          try:
              online = os.sysconf('SC_NPROCESSORS_ONLN')
              affinity = len(os.sched_getaffinity(0))
              if online < 1 or affinity < 1:
                  raise ValueError('No usable CPUs')
              limits.extend((online, affinity))
              measurements.update(online=online, affinity=affinity)
          except (OSError, ValueError) as exc:
              measurements['cpu_error'] = str(exc)
              limits.append(1)
          try:
              groups = [line.split(':', 2) for line in Path('/proc/self/cgroup').read_text(encoding='utf-8').splitlines()]
              if not groups or any(len(group) != 3 or not group[0].isdigit() for group in groups):
                  raise ValueError('Invalid cgroup membership')
              root = Path('/sys/fs/cgroup')
              v2 = (root / 'cgroup.controllers').exists()
              if v2:
                  matches = [path for hierarchy, controllers, path in groups if hierarchy == '0' and not controllers]
              else:
                  matches = [path for _, controllers, path in groups if 'cpu' in controllers.split(',')]
              if len(matches) != 1:
                  raise ValueError('Ambiguous CPU cgroup membership')
              relative = matches[0]
              if not relative.startswith('/') or any(part in ('.', '..') for part in relative.split('/')):
                  raise ValueError('Invalid cgroup path')
              if not v2:
                  cpu_root = next(path for path in (root / 'cpu', root / 'cpu,cpuacct') if path.is_dir()).resolve(strict=True)
                  if not cpu_root.is_relative_to(root):
                      raise ValueError('CPU cgroup mount escapes the hierarchy')
                  root = cpu_root
              mounts = []
              for line in Path('/proc/self/mountinfo').read_text(encoding='utf-8').splitlines():
                  fields, filesystem = line.split(' - ', 1)
                  fields, filesystem = fields.split(), filesystem.split()
                  if (len(fields) < 6 or len(filesystem) != 3 or
                      not fields[0].isdigit() or not fields[1].isdigit() or
                      re.fullmatch(r'[0-9]+:[0-9]+', fields[2]) is None):
                      raise ValueError('Invalid cgroup mount metadata')
                  hierarchy, mountpoint = [re.sub(r'\\([0-7]{3})', lambda match: chr(int(match[1], 8)), value)
                                           for value in fields[3:5]]
                  if any(not value.startswith('/') or '\\' in value or
                         any(part in ('.', '..') for part in value.split('/')) for value in (hierarchy, mountpoint)):
                      raise ValueError('Invalid cgroup mount path')
                  mounts.append((Path(hierarchy), Path(mountpoint), filesystem[0]))
              mapped = [(hierarchy, kind) for hierarchy, mountpoint, kind in mounts if mountpoint == root]
              if len(mapped) != 1 or mapped[0][1] != ('cgroup2' if v2 else 'cgroup'):
                  raise ValueError('Unknown CPU cgroup mount')
              mount_root = mapped[0][0]
              if any(mountpoint != root and mountpoint.is_relative_to(root) for _, mountpoint, _ in mounts):
                  raise ValueError('Obscured cgroup interfaces')
              if not Path(relative).is_relative_to(mount_root):
                  raise ValueError('Cgroup membership is outside its mount')
              current = root / Path(relative).relative_to(mount_root)
              if root.resolve(strict=True) != root or current.resolve(strict=True) != current or not current.is_dir():
                  raise ValueError('Invalid mapped cgroup directory')
              quotas = {}
              measurements['cgroup_quotas'] = quotas
              for directory in (current, *current.parents):
                  if not directory.is_relative_to(root):
                      continue
                  if v2:
                      try:
                          quota, period = (directory / 'cpu.max').read_text(encoding='utf-8').split()
                      except FileNotFoundError as exc:
                          if exc.errno != errno.ENOENT or directory != root or mount_root != Path('/'):
                              raise
                          entries = {entry.name for entry in root.iterdir()}
                          if 'cpu.max' in entries or 'cgroup.events' in entries or not {
                              'cgroup.controllers', 'cgroup.procs', 'cgroup.subtree_control'
                          }.issubset(entries):
                              raise ValueError('Unproven physical cgroup root') from exc
                          if 'cpu' not in (root / 'cgroup.controllers').read_text(encoding='utf-8').split():
                              raise ValueError('CPU controller is unavailable') from exc
                          (root / 'cgroup.procs').read_text(encoding='utf-8')
                          (root / 'cgroup.subtree_control').read_text(encoding='utf-8')
                          # Both interfaces are non-root-only; a namespaced child keeps cgroup.events.
                          measurements['physical_cgroup_root'] = str(root)
                          measurements['root_cpu_max'] = 'absent'
                          continue
                  else:
                      quota = (directory / 'cpu.cfs_quota_us').read_text(encoding='utf-8').strip()
                      period = (directory / 'cpu.cfs_period_us').read_text(encoding='utf-8').strip()
                  period = int(period)
                  if period <= 0:
                      raise ValueError('Invalid CPU quota period')
                  quotas[str(directory)] = [quota, period]
                  if quota != ('max' if v2 else '-1'):
                      capacity = int(quota) / period
                      if capacity <= 0:
                          raise ValueError('Invalid CPU quota')
                      limits.append(capacity)
          except (OSError, ValueError, OverflowError, RuntimeError, StopIteration) as exc:
              measurements['quota_error'] = str(exc)
              limits.append(1)
          workers = max(1, math.floor(min(limits)))
          measurements['workers'] = workers
          print(json.dumps(measurements, sort_keys=True), file=sys.stderr)
          print(workers)
          PY
          )
          scripts/run_tests.sh -j "$workers" --slice "${{ matrix.slice }}/4"
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pin the uv version: unpinned, setup-uv resolves "latest" by
          # fetching a manifest from raw.githubusercontent.com on EVERY job —
          # a transient fetch failure fails the whole job (2026-07-28 slice-5
          # incident). Pinned, the binary downloads directly; no manifest hop.
          version: "0.9.28"
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        #
        # Same extras as the test job's sync above: the hermetic test env
        # forbids mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in
        # tests/conftest.py), so lazy-install SDKs exercised by tests must be
        # in the venv up front.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Minimize uv cache
        # Optimized for CI: prunes pre-built wheels that are cheap to
        # re-download, keeping the persisted cache small and fast to restore.
        run: uv cache prune --ci

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
